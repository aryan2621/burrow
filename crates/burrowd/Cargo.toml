[package]
name = "burrowd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dirs = "6"
getrandom = "0.3"
futures-util = "0.3"
# SQLCipher: the whole DB is encrypted at rest; sqlx links this same crate
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
url = "2"
sha2 = "0.10"
aws-lc-rs = "1"
rmcp = { version = "3.7.0", features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
croner = "4.0.2"
chrono = "0.4.45"
notify = "8.2.1"
starship-battery = "0.12.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
mail-parser = "0.11.9"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Power"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
