[package]
name = "burrow-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "burrow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
